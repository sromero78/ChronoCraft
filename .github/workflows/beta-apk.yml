name: Beta APK

on:
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chronocraft-beta-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build web
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/chronocraft-release.jks

      - name: Build signed release APK
        working-directory: android
        env:
          CHRONOCRAFT_STORE_FILE: chronocraft-release.jks
          CHRONOCRAFT_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          CHRONOCRAFT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CHRONOCRAFT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Prepare APK and metadata
        id: meta
        shell: bash
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)
          VERSION_CODE=$(grep -oP 'versionCode\s+\K[0-9]+' android/app/build.gradle)
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="beta-${VERSION_NAME}-${VERSION_CODE}-${GITHUB_RUN_NUMBER}"
          APK="ChronoCraft-${VERSION_NAME}-beta.${GITHUB_RUN_NUMBER}.apk"
          cp "android/app/build/outputs/apk/release/ChronoCraft-v${VERSION_NAME}.apk" "$APK"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          APK: ${{ steps.meta.outputs.apk }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ChronoCraft Beta ${VERSION_NAME} · build ${GITHUB_RUN_NUMBER}" \
            --notes "Beta automática de ChronoCraft. Commit: ${SHORT_SHA}." \
            --prerelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk }}
          path: ${{ steps.meta.outputs.apk }}
          retention-days: 14
