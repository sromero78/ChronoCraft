name: Beta APK

on:
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Build web
        run: npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ChronoCraft-2.1.0-beta.1.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChronoCraft-2.1.0-beta.1
          path: ChronoCraft-2.1.0-beta.1.apk
          retention-days: 14
