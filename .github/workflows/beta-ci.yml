name: Beta CI

on:
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run lint
      - name: Build web
        run: npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Android debug
        working-directory: android
        run: ./gradlew assembleDebug
